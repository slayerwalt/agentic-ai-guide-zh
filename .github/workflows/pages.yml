name: Build and publish website

on:
  push:
    branches: [main, site/github-pages]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'figures/**'
      - 'contents/**'
      - 'book.tex'
      - 'book.bib'
      - 'zensical.toml'
      - 'requirements-site.txt'
      - '.github/workflows/pages.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-site.txt
      - name: Install website dependencies
        run: python -m pip install -r requirements-site.txt
      - name: Prepare MathJax
        run: python scripts/vendor_mathjax.py
      - name: Build and validate website
        run: python scripts/build_site.py
      - name: Upload website preview
        uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: site
          retention-days: 7
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
