[project.theme]
variant = "modern"
language = "zh"
font = false
features = ["navigation.indexes", "navigation.footer", "navigation.top", "toc.follow", "content.code.copy", "search.highlight"]

[[project.theme.palette]]
scheme = "default"
primary = "blue"
accent = "blue"
toggle.icon = "lucide/sun"
toggle.name = "切换到深色模式"

[[project.theme.palette]]
scheme = "slate"
primary = "blue"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "切换到浅色模式"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
sane_lists = {}
tables = {}
toc.permalink = true
toc.toc_depth = 3
pymdownx.arithmatex.generic = true
pymdownx.details = {}
pymdownx.superfences = {}
